<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OAQA execution workflow</title>
  <desc id="desc">Bootstrap and role call lead into a repeated loop of test runs and test run reports, followed by a final wrap-up and final overall report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="30" fill="#f8fafc"/>
  <rect x="36" y="36" width="1528" height="828" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="800" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#0f172a">OAQA Execution Workflow</text>
  <text x="800" y="152" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">Setup, role readiness, repeated test loops, and one final evidence report.</text>

  <g filter="url(#shadow)">
    <rect x="94" y="326" width="270" height="154" rx="20" fill="#ecfeff" stroke="#0f766e" stroke-width="4"/>
    <text x="229" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Bootstrap</text>
    <text x="229" y="426" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#475569">environment</text>
    <text x="229" y="452" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#475569">and dependencies</text>
  </g>

  <path d="M382 403 H448" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="468" y="326" width="270" height="154" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <text x="603" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Role Call</text>
    <text x="603" y="426" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#475569">confirm personas</text>
    <text x="603" y="452" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#475569">and identities</text>
  </g>

  <path d="M756 403 H822" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="842" y="230" width="444" height="346" rx="26" fill="#fff7ed" stroke="#d97706" stroke-width="4"/>
    <text x="1064" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Loop Through Test Runs</text>
    <text x="1064" y="328" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#64748b">repeat for workflows, branches, and edge cases</text>

    <rect x="902" y="374" width="172" height="104" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="3"/>
    <text x="988" y="417" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Test Run</text>
    <text x="988" y="449" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#64748b">bounded actions</text>

    <path d="M1088 426 H1122" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

    <rect x="1138" y="374" width="172" height="104" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="3"/>
    <text x="1224" y="411" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Test Run</text>
    <text x="1224" y="443" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Report</text>

    <path d="M1224 494 C1224 540 988 540 988 494" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
    <text x="1106" y="538" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">next scenario</text>
  </g>

  <path d="M1304 403 H1370" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1390" y="326" width="116" height="154" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
    <text x="1448" y="388" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Final</text>
    <text x="1448" y="422" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Wrap</text>
    <text x="1448" y="456" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Up</text>
  </g>

  <path d="M1448 498 C1448 674 1190 684 1130 684" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="448" y="640" width="664" height="104" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <text x="780" y="684" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Final Overall Report</text>
    <text x="780" y="720" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#64748b">summary, evidence, failures, likely boundaries, and next actions</text>
  </g>
</svg>
